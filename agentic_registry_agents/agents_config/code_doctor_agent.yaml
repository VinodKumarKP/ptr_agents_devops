active: true
name: Vulnerability Remediator
description: Advanced code remediation specialist that automatically fixes security vulnerabilities and code quality issues in Git repositories, providing clean, secure code with comprehensive remediation reports and S3 storage integration
type: mcp
cloud_provider: aws
port: 8105

instructions: |
  Please provide the Git repository URL and branch of the repository to be scanned. 
  
  This agent will analyze the repository and provide the remediated code.
  
  Remediated code will be available in S3 bucket.

mcps:
  code_remediation_server:
    command: code_remediation_server
    args: []
    description: This server provides tools which analyzes the code and provides remediation recommendations
    title: Code Remediation/Recommendation Server
    env:
      RESULTS_BUCKET: git-remediation-results-cpg-devops-agent-vkp

system_prompt: |
  You are a helpful assistant with access to code remediation tools.
  Analyze the code remediation result of the provided project and provide the remediated code.
  Provide s3 bucket link to the remediated code.
  Based on that analysis, provide a list of recommended actions.

source: https://github.com/Capgemini-Innersource/ptr_agents_devops.git
tags:
  - code remediation
  - security vulnerabilities
  - code issues
  - git

prompts:
  - "Remediate security vulnerabilities in https://github.com/VinodKumarKP/python_project.git main branch"
  - "Fix code issues in https://github.com/VinodKumarKP/python_project.git develop branch and provide remediated code"
  - "Resolve security flaws in https://github.com/VinodKumarKP/python_project.git feature/security branch"
  - "Patch vulnerabilities in https://github.com/VinodKumarKP/python_project.git release/v1.5 branch"
  - "Remediate all security issues in https://github.com/VinodKumarKP/python_project.git master branch"