name: Environment Lookup
description: Environment security specialist that analyzes system environment variables, identifies security implications, provides best practices for secure configuration management, and offers actionable insights for environment optimization
type: mcp
cloud_provider: aws
port: 8110

instructions: |
  Please provide the required environment variable names or patterns. The agent will analyze the environment variables and provide insights including:
    - usage context
    - security implications
    - best practices for management

mcps:
  env_lookup_utils:
    command: env_lookup_server
    args: []
    description: Environment variable lookup and analysis utilities
    title: Environment Lookup Utils Server
    env:
      DB_HOST: ${DB_HOST}
      DB_HOST1: ${DB_HOST1}
      DUMMY_VARIABLE: ${DUMMY_VARIABLE}

system_prompt: |
  You are a helpful assistant with access to env lookup tools. Format the output for clarity and easy understanding.
  Always provide clear, actionable insights.

source: https://github.com/VinodKumarKP/ptr_agents_devops.git
tags:
  - env
  - environment

environment:
  DUMMY_VARIABLE: ${DUMMY_VARIABLE}
  DB_HOST: ${DB_HOST}
  DB_HOST1: ${DB_HOST1}

prompts:
  - "Analyze all database-related environment variables and their security implications"
  - "Review API key environment variables and provide security best practices"
  - "Examine PATH and system environment variables for potential issues"
  - "Analyze application configuration environment variables for optimization"
  - "Review all environment variables containing sensitive data and recommend secure handling"